# Logrotate configuration for Cattyshack Automation Platform
# This configuration manages rotation for all PM2 and Winston application logs
#
# Rotation Policy:
# - Rotate when log files reach 50MB
# - Keep 7 rotations (approximately 7 days with size-based rotation)
# - Compress rotated logs to save disk space
# - Handle missing logs gracefully
#
# Installation:
#   sudo cp config/logrotate.conf /etc/logrotate.d/cattyshack
#   sudo logrotate -d /etc/logrotate.d/cattyshack  # test configuration
#
# Manual rotation:
#   sudo logrotate -f /etc/logrotate.d/cattyshack

# Absolute path - update this to match your installation directory
/Users/ruslanbelyy/Documents/Projects/cattyshack-automation-website/logs/*.log {
    # Rotate when file size reaches 50MB
    size 50M

    # Keep 7 rotations (7 cycles of logs)
    rotate 7

    # Compress rotated logs using gzip
    compress

    # Delay compression of the most recent rotation
    # This allows time for any lingering writes to complete
    delaycompress

    # Don't error if a log file is missing
    missingok

    # Don't rotate empty log files
    notifempty

    # Create new log file with specified permissions after rotation
    create 0644 ruslanbelyy staff

    # Use copytruncate instead of moving files
    # This is safer for processes that keep file handles open (PM2, Winston)
    # The log file is copied, then truncated in place
    copytruncate

    # Don't use date as suffix (use .1, .2, etc. instead)
    nodateext

    # Share rotation state between all log files in this config
    sharedscripts

    # Run after rotation completes (optional post-rotation commands)
    postrotate
        # Optionally restart PM2 processes to ensure clean log state
        # Uncomment the line below if you experience issues with log writes
        # /usr/local/bin/pm2 reloadLogs
    endscript
}
